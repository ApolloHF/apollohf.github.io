/* Apollo HF components: plain CSS classes, no JavaScript. Loaded after tokens.css. */
.ahf-page{background:var(--surface);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:26px;-webkit-font-smoothing:antialiased}
.ahf-inverse{background:var(--surface-inverse);color:var(--on-inverse);--focus:var(--accent-bright);--ink:var(--on-inverse);--ink-muted:var(--on-inverse-muted);--accent-ink:var(--accent-bright);--hairline:#35322d}
.ahf-container{max-width:1120px;margin:0 auto;padding-left:var(--space-4);padding-right:var(--space-4)}
.ahf-section{padding-top:var(--space-16);padding-bottom:var(--space-16)}
@media (min-width:768px){.ahf-container{padding-left:var(--space-8);padding-right:var(--space-8)}.ahf-section{padding-top:var(--space-24);padding-bottom:var(--space-24)}}

/* Button */
.ahf-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:48px;padding:0 var(--space-6);border:1px solid transparent;border-radius:var(--radius-pill);font:500 16px/1 var(--font-sans);text-decoration:none;cursor:pointer;transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.ahf-btn:focus-visible,.ahf-input:focus-visible,.ahf-link:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.ahf-btn--primary{background:var(--accent);color:var(--on-accent)}
.ahf-btn--primary:hover{background:var(--accent-bright)}
.ahf-btn--secondary{background:transparent;color:var(--ink);border-color:var(--border-strong)}
.ahf-btn--secondary:hover{border-color:var(--ink)}
.ahf-btn[disabled],.ahf-btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.ahf-link{color:var(--accent-ink);font-weight:500;text-decoration:underline;text-underline-offset:4px}

/* Eyebrow and badge */
.ahf-eyebrow{margin:0;font:700 12px/16px var(--font-sans);letter-spacing:.22em;text-transform:uppercase;color:var(--accent-ink)}
.ahf-badge{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);border:1px solid var(--border-strong);border-radius:var(--radius-pill);font:500 12px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.ahf-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* Pillar */
.ahf-pillars{display:grid;gap:var(--space-8);grid-template-columns:1fr}
@media (min-width:768px){.ahf-pillars{grid-template-columns:repeat(3,1fr)}}
.ahf-pillar{border-top:1px solid var(--hairline);padding-top:var(--space-4)}
.ahf-pillar__title{margin:0 0 var(--space-2);font:500 28px/36px var(--font-display);color:var(--accent-ink)}
.ahf-pillar__text{margin:0;font:400 16px/26px var(--font-sans);color:var(--ink-muted)}

/* Email field */
.ahf-field{display:flex;flex-direction:column;gap:var(--space-2);max-width:520px}
.ahf-field__label{font:500 14px/20px var(--font-sans);color:var(--ink)}
.ahf-field__row{display:flex;flex-direction:column;gap:var(--space-3)}
@media (min-width:560px){.ahf-field__row{flex-direction:row}}
.ahf-input{flex:1;min-width:0;height:48px;padding:0 var(--space-4);background:var(--surface-raised);color:var(--ink);border:1px solid var(--border-strong);border-radius:var(--radius-md);font:400 16px/1 var(--font-sans)}

/* Hero */
.ahf-hero{padding-top:var(--space-16);padding-bottom:var(--space-16)}

.ahf-hero__title em{font-style:italic;color:var(--accent-ink)}
.ahf-hero__lede{margin:var(--space-6) 0 0;max-width:46ch;font:400 20px/30px var(--font-sans);color:var(--ink-muted)}
.ahf-hero__actions{display:flex;flex-wrap:wrap;gap:var(--space-3);margin-top:var(--space-8)}

/* Footer */
.ahf-footer{border-top:1px solid var(--hairline);padding-top:var(--space-6);padding-bottom:var(--space-6);display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--space-3);font:400 12px/18px var(--font-sans);color:var(--ink-subtle)}
.ahf-inverse .ahf-footer{color:var(--on-inverse-muted)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

main>section{flex:1;display:flex;align-items:flex-end}
main>section>.ahf-container{width:100%}
h1,h2,h3,p{margin:0}
.band{position:relative;overflow:hidden;background:var(--surface);color:var(--ink)}
.band--ink{--focus:var(--accent-bright)}
.disc{display:none;position:absolute;border-radius:50%;background:var(--accent);pointer-events:none}

.hero .ahf-hero__title{font-size:clamp(44px,6.4vw,80px);max-width:9em;line-height:1}
